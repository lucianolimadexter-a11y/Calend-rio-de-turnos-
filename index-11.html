  --bg-main:#faf7f2; --card-bg:#ffffff; --card-border:#8a7a4a; --header-border:#7a6a3a; --h1-color:#7a6a3a;
  --label-warn:#9a5f10; --select-warn:#9a5f10; --label-accent:#7a6a3a; --select-accent:#8a7a4a;
  --horario-color:#6a6050; --calhead-color:#8a7a4a; --calnav-border:#8a7a4a; --calnav-color:#7a6a3a;
  --caldow-color:#7a7060; --calday-bg:#f2eee4; --calday-color:#332c22;
  --trabalho-bg:#e0d6b6; --trabalho-color:#3a3018; --folga-bg:#e8c4b4; --folga-color:#5e2e1c;
  --hoje-border:#332c22; --selecionado-border:#9a5f10; --feriado-dot:#a8628a; --nota-dot:#9a5f10;
  --legend-color:#6a6050; --detalhe-trabalho-border:#8a7a4a; --detalhe-folga-border:#b8664c;
  --valor-trabalho-color:#7a6a3a; --valor-folga-color:#a04e34; --sub-color:#6a6050;
  --feriadonome-color:#5e2c48; --feriadonome-bg:#f5e6ef; --feriadonome-border:#a8628a; --vazio-color:#7a7060;
  --clima-bg:#f5f1e8; --clima-border:#8a7a4a; --climatemp-color:#332c22; --climadesc-color:#6a6050; --climaindisp-color:#948a78;
  --notaobs-label-color:#6a6050; --textarea-border:#8a7a4a; --textarea-bg:#ffffff; --textarea-color:#302a1e;
  --btnlimpar-border:#948a78; --btnlimpar-color:#6a6050; --btnsalvar-bg:#8a7a4a; --btnsalvar-color:#ffffff;
  --salvomsg-color:#7a6a3a; --avisobanner-bg:#f7ecd8; --avisobanner-border:#9a5f10; --avisobanner-color:#7a4a0c;
}

main{max-width:760px;margin:auto;padding:16px}

.card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:18px;padding:20px;margin:14px 0}

.header-card{display:flex;flex-direction:column;align-items:center;gap:6px;border-color:var(--header-border);padding:14px 12px}
.header-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:8px;column-gap:10px;width:100%}
h1{font-size:clamp(15px,4vw,19px);margin:0 0 2px;color:var(--h1-color);letter-spacing:.02em;text-align:center}

.turma-bolha{display:flex;align-items:center;gap:4px;flex-shrink:0}
.turma-bolha span{font-size:12px;color:var(--label-warn);font-weight:700;white-space:nowrap}
.turma-bolha select{padding:4px 8px;font-size:14px;border-radius:8px;border:none;background:transparent;color:var(--select-warn);font-weight:800;cursor:pointer}
.turno-bolha{display:flex;align-items:center;gap:4px;flex-shrink:0}
.turno-bolha span{font-size:12px;color:var(--label-accent);font-weight:700;white-space:nowrap}
.turno-bolha select{padding:4px 8px;font-size:14px;border-radius:8px;border:none;background:transparent;color:var(--select-accent);font-weight:800;cursor:pointer}
.tema-bolha{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tema-bolha span{font-size:12px;color:var(--label-accent);font-weight:700;white-space:nowrap}
.tema-bolha select{padding:4px 8px;font-size:14px;border-radius:8px;border:none;background:transparent;color:var(--select-accent);font-weight:800;cursor:pointer}
.fundo-toggle{width:auto;flex-shrink:0;padding:5px 9px;font-size:14px;background:transparent;border:2px solid var(--card-border);color:var(--h1-color);border-radius:10px;cursor:pointer;line-height:1}
.horario-info{width:100%;text-align:center;font-size:12px;color:var(--horario-color);margin-top:2px}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head h2{margin:0;text-transform:capitalize;color:var(--calhead-color);font-size:16px}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:auto;margin:0;padding:8px 14px;font-size:16px;background:transparent;border:2px solid var(--calnav-border);color:var(--calnav-color);border-radius:12px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;color:var(--caldow-color);text-align:center;padding-bottom:4px;font-weight:700}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--calday-color);background:var(--calday-bg);cursor:pointer}
.cal-day.empty{visibility:hidden;cursor:default}
.cal-day.trabalho{background:var(--trabalho-bg);color:var(--trabalho-color);font-weight:700}
.cal-day.folga{background:var(--folga-bg);color:var(--folga-color);font-weight:700}
.cal-day.hoje{border:2px solid var(--hoje-border)}
.cal-day.selecionado{border:2px solid var(--selecionado-border)}
.cal-day.feriado::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--feriado-dot)}
.cal-day.com-nota::before{content:'📌';position:absolute;bottom:1px;left:1px;font-size:9px;line-height:1}
.cal-day .clima-ico{position:absolute;top:2px;left:3px;font-size:11px;line-height:1;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}

.legend{display:flex;gap:10px;margin-top:14px;font-size:12px;color:var(--legend-color);flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px}
.dot.trabalho{background:var(--valor-trabalho-color)}
.dot.folga{background:var(--valor-folga-color)}
.dot.feriado{background:var(--feriado-dot);border-radius:50%}

.detalhe{text-align:center;padding:16px}
.detalhe.trabalho{border-color:var(--detalhe-trabalho-border)}
.detalhe.folga{border-color:var(--detalhe-folga-border)}
.detalhe .valor{font-size:clamp(18px,5vw,24px);font-weight:900}
.detalhe .valor.trabalho{color:var(--valor-trabalho-color)}
.detalhe .valor.folga{color:var(--valor-folga-color)}
.detalhe .sub{color:var(--sub-color);font-size:13px;margin-top:4px;text-transform:capitalize}
.detalhe .feriado-nome{margin-top:8px;color:var(--feriadonome-color);background:var(--feriadonome-bg);border:2px solid var(--feriadonome-border);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.detalhe .vazio{color:var(--vazio-color);font-size:13px}
.detalhe .clima{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--clima-bg);border:2px solid var(--clima-border);border-radius:12px;padding:8px 14px}
.detalhe .clima .clima-ico-grande{font-size:26px}
.detalhe .clima .clima-temp{font-size:15px;color:var(--climatemp-color);font-weight:700}
.detalhe .clima .clima-desc{font-size:12px;color:var(--climadesc-color)}
.detalhe .clima-indisponivel{margin-top:10px;font-size:11px;color:var(--climaindisp-color)}
.obs-secao{margin-top:14px;text-align:left}
.obs-secao .obs-titulo{font-size:12px;color:var(--notaobs-label-color);margin-bottom:8px;font-weight:700}
.obs-secao .obs-vazio{font-size:13px;color:var(--vazio-color);margin-bottom:10px}
.obs-secao .obs-item{background:var(--calday-bg);border-radius:12px;padding:12px;margin-bottom:10px}
.obs-secao .obs-texto{font-size:14px;color:var(--textarea-color);white-space:pre-wrap;word-break:break-word}
.obs-secao .obs-foto{max-width:100%;max-height:200px;border-radius:10px;border:2px solid var(--textarea-border);display:block;margin:8px auto 0}
.obs-secao .obs-acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.obs-secao .obs-acoes button{width:auto;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:2px solid var(--textarea-border);color:var(--notaobs-label-color)}
.obs-secao .obs-acoes .btn-excluir{border-color:var(--valor-folga-color);color:var(--valor-folga-color)}
.obs-secao .obs-confirmar-texto{font-size:13px;color:var(--valor-folga-color);font-weight:700;margin-top:6px}
.obs-secao .obs-editando textarea{width:100%;min-height:64px;padding:10px 12px;border-radius:12px;border:2px solid var(--textarea-border);background:var(--textarea-bg);color:var(--textarea-color);font-family:inherit;font-size:14px;resize:vertical}
.obs-secao .nota-anexo{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.obs-secao .nota-anexo button{width:auto;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:2px solid var(--textarea-border);color:var(--notaobs-label-color)}
.obs-secao .anexo-nome{font-size:12px;color:var(--notaobs-label-color);margin-top:6px;word-break:break-all}
.obs-secao .nota-acoes{display:flex;gap:8px;margin-top:10px;justify-content:center}
.obs-secao .nota-acoes button{width:auto;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
.obs-secao .btn-salvar{background:var(--btnsalvar-bg);color:var(--btnsalvar-color)}
.obs-secao .btn-limpar{background:transparent;border:2px solid var(--btnlimpar-border);color:var(--btnlimpar-color)}
.obs-secao .btn-nova-obs{width:100%;padding:10px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;border:2px dashed var(--textarea-border);color:var(--notaobs-label-color);border-radius:12px;margin-top:4px}
.obs-secao .salvo-msg{font-size:12px;color:var(--salvomsg-color);margin-top:6px;text-align:center;min-height:16px}

.aviso-footer{max-width:760px;margin:0 auto;padding:0 16px 22px;display:flex;flex-direction:column;gap:8px}
.aviso-banner{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--avisobanner-bg);border:2px solid var(--avisobanner-border);border-radius:16px;padding:12px 16px;color:var(--avisobanner-color);font-size:13px;font-weight:600;text-align:left;min-width:0;width:100%;font-family:inherit;cursor:pointer}
.aviso-banner span:last-child{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.aviso-banner .aviso-icone{font-size:18px;flex-shrink:0}
button{border:none;border-radius:14px}

.novidades-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.novidades-overlay[hidden]{display:none}
.novidades-overlay::before{content:'NOVA ATUALIZAÇÃO';position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:15px;letter-spacing:.06em}
.novidades-card{max-width:360px;width:100%;background:var(--card-bg);border:2px solid var(--card-border);border-radius:18px;padding:22px 20px;text-align:center}
.novidades-card h3{margin:0 0 14px;color:var(--h1-color);font-size:17px}
.novidades-card ul{text-align:left;margin:0 0 18px;padding-left:18px;color:var(--calday-color);font-size:13.5px;line-height:1.6}
.novidades-card li{margin-bottom:6px}
.novidades-card button{border:none;border-radius:14px;background:var(--btnsalvar-bg);color:var(--btnsalvar-color);font-weight:800;font-size:14px;padding:10px 28px;cursor:pointer}
</style>
</head>

<script>
// Âncora: 25/07/2026 (sábado) = 1º dia de folga da turma C1 (posição 7 de um ciclo de 8: 6 trabalho + 2 folga)
const ANCHOR = new Date(2026, 6, 25);
const ANCHOR_POS_C1 = 7;

// Calcula a data da Páscoa (algoritmo de Gauss/anônimo) para qualquer ano
function calcularPascoa(ano){
  const a = ano % 19;
  const b = Math.floor(ano / 100);
  const c = ano % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const mes = Math.floor((h + l - 7*m + 114) / 31); // 3=março, 4=abril
  const dia = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(ano, mes - 1, dia);
}

function somarDias(data, dias){
  const d = new Date(data);
  d.setDate(d.getDate() + dias);
  return d;
}

function feriadosDoAno(ano){
  const pascoa = calcularPascoa(ano);
  const carnavalSegunda = somarDias(pascoa, -48);
  const carnavalTerca = somarDias(pascoa, -47);
  const sextaSanta = somarDias(pascoa, -2);
  const corpusChristi = somarDias(pascoa, 60);

  const lista = {};
  lista[dateKey(new Date(ano,0,1))]   = 'Confraternização Universal';
  lista[dateKey(carnavalSegunda)]     = 'Carnaval (segunda)';
  lista[dateKey(carnavalTerca)]       = 'Carnaval (terça)';
  lista[dateKey(sextaSanta)]          = 'Sexta-feira Santa';
  lista[dateKey(new Date(ano,3,21))]  = 'Tiradentes';
  lista[dateKey(new Date(ano,4,1))]   = 'Dia do Trabalho';
  lista[dateKey(new Date(ano,4,13))]  = 'Festa de São Benedito (municipal)';
  lista[dateKey(corpusChristi)]       = 'Corpus Christi';
  lista[dateKey(new Date(ano,8,7))]   = 'Independência do Brasil';
  lista[dateKey(new Date(ano,9,12))]  = 'Nossa Senhora Aparecida';
  lista[dateKey(new Date(ano,10,2))]  = 'Finados';
  lista[dateKey(new Date(ano,10,6))]  = 'Aniversário de Poços de Caldas (municipal)';
  lista[dateKey(new Date(ano,10,15))] = 'Proclamação da República';
  lista[dateKey(new Date(ano,10,20))] = 'Consciência Negra';
  lista[dateKey(new Date(ano,11,25))] = 'Natal';
  return lista;
}

// Cache de feriados por ano, calculados sob demanda (funciona para qualquer ano)
const FERIADOS_CACHE = {};
function feriadoNaData(date){
  const ano = date.getFullYear();
  if(!FERIADOS_CACHE[ano]) FERIADOS_CACHE[ano] = feriadosDoAno(ano);
  return FERIADOS_CACHE[ano][dateKey(date)] || null;
}

function dateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

const ESCALA_MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

function cycleInfo(date, turma){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const info = (d.getFullYear() === 2026)
    ? infoDaEscalaReal(d, turma)
    : infoDoCicloGenerico(d, turma);
  info.feriado = feriadoNaData(d);
  info.data = d;
  return info;
}

// escala real (2026), vinda direto da planilha do Excel
function infoDaEscalaReal(d, turma){
  const mesNome = ESCALA_MESES[d.getMonth()];
  const diasTrabalho = ESCALA_2026[mesNome][String(turma)];
  const trabalha = diasTrabalho.includes(d.getDate());
  return trabalha ? {status:'trabalho'} : {status:'folga'};
}

// fórmula genérica de ciclo 6x2, usada como aproximação pra anos fora de 2026 (sem dado real do Excel ainda)
function infoDoCicloGenerico(d, turma){
  const diffDays = Math.round((d - ANCHOR) / 86400000);
  const offset = (turma - 1) * 2; // cada turma seguinte inicia a folga 2 dias depois da anterior
  let pos = ((ANCHOR_POS_C1 - 1 + diffDays - offset) % 8 + 8) % 8 + 1;
  return pos <= 6 ? {status:'trabalho', dayNum:pos, total:6} : {status:'folga', dayNum:pos-6, total:2};
}

// Previsão do tempo (Open-Meteo, Poços de Caldas-MG). Sem chave de API, atualiza a cada carregamento.
const CLIMA_LAT = -21.7875, CLIMA_LON = -46.5686;
let CLIMA_CACHE = {}; // { 'YYYY-MM-DD': {codigo, max, min} }
let CLIMA_CARREGADO = false;

function climaIcone(codigo){
  if(codigo === 0) return '☀️';
  if([1,2].includes(codigo)) return '🌤️';
  if(codigo === 3) return '☁️';
  if([45,48].includes(codigo)) return '🌫️';
  if([51,53,55,56,57].includes(codigo)) return '🌦️';
  if([61,63,65,66,67,80,81,82].includes(codigo)) return '🌧️';
  if([71,73,75,77,85,86].includes(codigo)) return '🌨️';
  if([95,96,99].includes(codigo)) return '⛈️';
  return '⛅';
}

function climaDescricao(codigo){
  if(codigo === 0) return 'Céu limpo';
  if([1,2].includes(codigo)) return 'Poucas nuvens';
  if(codigo === 3) return 'Nublado';
  if([45,48].includes(codigo)) return 'Neblina';
  if([51,53,55,56,57].includes(codigo)) return 'Garoa';
  if([61,63,65,66,67,80,81,82].includes(codigo)) return 'Chuva';
  if([71,73,75,77,85,86].includes(codigo)) return 'Neve';
  if([95,96,99].includes(codigo)) return 'Tempestade';
  return 'Parcialmente nublado';
}

async function carregarPrevisao(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CLIMA_LAT}&longitude=${CLIMA_LON}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=7`;
    const res = await fetch(url);
    const data = await res.json();
    const dias = data.daily.time;
    CLIMA_CACHE = {};
    dias.forEach((iso, idx)=>{
      CLIMA_CACHE[iso] = {
        codigo: data.daily.weathercode[idx],
        max: Math.round(data.daily.temperature_2m_max[idx]),
        min: Math.round(data.daily.temperature_2m_min[idx])
      };
    });
    CLIMA_CARREGADO = true;
    renderCalendar();
    if(diaSelecionado) mostrarDetalhe(diaSelecionado);
  }catch(e){
    CLIMA_CARREGADO = false;
  }
}

// Guarda uma LISTA de observações por dia (cada uma com texto e foto opcional).
// Se existir dado do formato antigo (uma nota + uma foto por dia), migra automaticamente na primeira leitura.
function lerObservacoes(key){
  try{
    const bruto = localStorage.getItem(OBS_STORAGE_PREFIX + key);
    if(bruto) return JSON.parse(bruto);
  }catch(e){}
  try{
    const textoAntigo = localStorage.getItem(NOTA_STORAGE_PREFIX + key);
    const fotoAntiga = localStorage.getItem(FOTO_STORAGE_PREFIX + key);
    if(textoAntigo || fotoAntiga){
      const migrada = [{id: 'm' + Date.now(), texto: textoAntigo || '', foto: fotoAntiga || null}];
      salvarObservacoes(key, migrada);
      localStorage.removeItem(NOTA_STORAGE_PREFIX + key);
      localStorage.removeItem(FOTO_STORAGE_PREFIX + key);
      return migrada;
    }
  }catch(e){}
  return [];
}

function salvarObservacoes(key, lista){
  try{
    if(!lista || lista.length === 0){ localStorage.removeItem(OBS_STORAGE_PREFIX + key); }
    else{ localStorage.setItem(OBS_STORAGE_PREFIX + key, JSON.stringify(lista)); }
    return true;
  }catch(e){ return false; }
}

// Reduz a foto (redimensiona e comprime) antes de guardar, pra caber no espaço limitado do navegador
function comprimirImagem(file, maxDim, qualidade){
  const trabalho = new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const tempoLimite = new Promise((_, reject)=> setTimeout(()=> reject(new Error('tempo esgotado')), 8000));
  return Promise.race([trabalho, tempoLimite]);
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buscarProximosAvisos(diasLimite, maxItens){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const lista = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(!key || !key.startsWith(OBS_STORAGE_PREFIX)) continue;
      const partes = key.slice(OBS_STORAGE_PREFIX.length).split('-');
      if(partes.length !== 3) continue;
      const data = new Date(parseInt(partes[0],10), parseInt(partes[1],10)-1, parseInt(partes[2],10));
      const diffDias = Math.round((data - hoje) / 86400000);
      if(diffDias < 0 || diffDias > diasLimite) continue;
      let observacoes = [];
      try{ observacoes = JSON.parse(localStorage.getItem(key)) || []; }catch(e){ continue; }
      const comTexto = observacoes.filter(o => o.texto && o.texto.trim() !== '');
      if(comTexto.length === 0) continue;
      const extras = comTexto.length - 1;
      const texto = comTexto[0].texto + (extras > 0 ? ` (+${extras} ${extras>1?'observações':'observação'})` : '');
      lista.push({diffDias, data, texto});
    }
  }catch(e){}
  lista.sort((a,b)=> a.diffDias - b.diffDias);
  return lista.slice(0, maxItens);
}

function ehHoje(date){
  if(!date) return false;
  const hoje = new Date();
  return date.toDateString() === hoje.toDateString();
}

function renderAvisoFooter(){
  const el = document.getElementById('avisoFooter');
  if(!el) return;
  if(!ehHoje(diaSelecionado)){ el.innerHTML = ''; return; }
  const avisos = buscarProximosAvisos(5, 2);
  if(avisos.length === 0){ el.innerHTML = ''; return; }
  el.innerHTML = avisos.map((aviso, idx) => {
    const dataTexto = aviso.data.toLocaleDateString('pt-BR', {day:'2-digit', month:'long'});
    return `<button type="button" class="aviso-banner" data-idx="${idx}"><span class="aviso-icone">📌</span><span>${dataTexto}: "${escapeHtml(aviso.texto)}"</span></button>`;
  }).join('');
  el.querySelectorAll('.aviso-banner').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const aviso = avisos[parseInt(btn.dataset.idx, 10)];
      irParaDia(aviso.data);
    });
  });
}

function primeiroDiaComNotaNoMes(ano, mes){
  const daysInMonth = new Date(ano, mes+1, 0).getDate();
  for(let day=1; day<=daysInMonth; day++){
    const date = new Date(ano, mes, day);
    if(lerObservacoes(dateKey(date)).length > 0) return date;
  }
  return null;
}

function aoEntrarNoMes(){
  const achado = primeiroDiaComNotaNoMes(viewYear, viewMonth);
  if(achado){
    diaSelecionado = achado;
    mostrarDetalhe(achado);

    diaSelecionado = null;
    limparDetalhe();

  renderAvisoFooter();

function mostrarDetalhe(date){
  const info = cycleInfo(date, turmaAtual());
  const key = dateKey(date);
  if(obsDiaAtualKey !== key){
    obsEditandoId = null;
    obsConfirmandoExclusaoId = null;
    arquivoAnexado = null;
  }
  obsDiaAtualKey = key;
  const detalhe = document.getElementById('detalhe');
  const dataCompleta = date.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  const dataCurta = date.toLocaleDateString('pt-BR',{day:'2-digit', month:'long', year:'numeric'});
  const clima = CLIMA_CACHE[key];
  const climaHtml = clima
    ? `<div class="clima">
         <span class="clima-ico-grande">${climaIcone(clima.codigo)}</span>
         <div>
           <div class="clima-temp">${clima.min}° / ${clima.max}°</div>
           <div class="clima-desc">${climaDescricao(clima.codigo)}</div>
         </div>
       </div>`
    : (CLIMA_CARREGADO ? `<div class="clima-indisponivel">Previsão só disponível para os próximos 7 dias</div>` : '');
  detalhe.className = 'card detalhe ' + info.status;
  detalhe.innerHTML = `
    <div class="valor ${info.status}">${info.status === 'trabalho' ? 'TRABALHO' : 'FOLGA'}</div>
    <div class="sub">${info.dayNum ? ('Dia ' + info.dayNum + ' de ' + info.total + ' · ') : ''}${dataCompleta}</div>
    ${info.feriado ? `<div class="feriado-nome">Feriado: ${info.feriado}</div>` : ''}
    ${climaHtml}
    ${renderObsSecaoHtml(key, dataCurta)}
  `;
  bindObsEventos(date);
}

function renderObsSecaoHtml(key, dataCurta){
  const lista = lerObservacoes(key);
  let itens = '';
  if(lista.length === 0 && obsEditandoId !== 'novo'){
    itens = '<div class="obs-vazio">Nenhuma observação neste dia.</div>';
  }else{
    itens = lista.map(o => {
      if(obsEditandoId === o.id) return renderObsFormHtml(o);
      if(obsConfirmandoExclusaoId === o.id) return renderObsConfirmarExclusaoHtml(o);
      return renderObsItemHtml(o);
    }).join('');
  }
  const formNovo = obsEditandoId === 'novo' ? renderObsFormHtml(null) : '';
  const btnNova = obsEditandoId === null ? `<button type="button" class="btn-nova-obs" data-action="nova">➕ Nova observação</button>` : '';
  return `
    <div class="obs-secao">
      <div class="obs-titulo">Observações · ${dataCurta}</div>
      ${itens}
      ${formNovo}
      ${btnNova}
      <div class="salvo-msg" id="notaSalvoMsg"></div>
    </div>`;
}

async function dataUrlParaArquivo(dataUrl, nomeArquivo){
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return new File([blob], nomeArquivo, {type: blob.type});
}

async function compartilharObs(mensagem, fotoDataUrl){
  const msgEl = document.getElementById('notaSalvoMsg');
  if(!navigator.share){
    try{ await navigator.clipboard.writeText(mensagem); if(msgEl) msgEl.textContent = 'Compartilhamento não é suportado aqui — mensagem copiada.'; }catch(e){}
    return;
  }
  if(fotoDataUrl){
    try{
      const arquivo = await dataUrlParaArquivo(fotoDataUrl, 'foto.jpg');
      await navigator.share({text: mensagem, files: [arquivo]});
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }
  try{
    await navigator.share({text: mensagem});
    if(fotoDataUrl && msgEl) msgEl.textContent = 'Esse celular não deixa mandar a foto pelo compartilhar — só a mensagem foi enviada.';
  }catch(e){}
}

function bindObsEventos(date){
  const key = dateKey(date);
  const secao = document.querySelector('.obs-secao');
  if(!secao) return;
  secao.addEventListener('change', (e)=>{
    if(e.target.matches('.obs-arquivo-input')){
      const id = e.target.id.replace('obsArquivo_', '');
      arquivoAnexado = e.target.files && e.target.files[0] ? e.target.files[0] : null;
      const nomeEl = document.getElementById('obsAnexoNome_' + id);
      const previewEl = document.getElementById('obsPreview_' + id);
      if(nomeEl) nomeEl.textContent = arquivoAnexado ? ('📎 ' + arquivoAnexado.name) : '';
      if(previewEl){
        if(arquivoAnexado){
          previewEl.src = URL.createObjectURL(arquivoAnexado);
          previewEl.style.display = '';
        }else{
          previewEl.style.display = 'none';
        }
      }
    }
  });
  secao.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if(action === 'nova'){
      obsEditandoId = 'novo';
      arquivoAnexado = null;
      mostrarDetalhe(date);
    }else if(action === 'editar'){
      obsEditandoId = id;
      arquivoAnexado = null;
      mostrarDetalhe(date);
    }else if(action === 'cancelar-item'){
      obsEditandoId = null;
      arquivoAnexado = null;
      mostrarDetalhe(date);
    }else if(action === 'excluir'){
      obsConfirmandoExclusaoId = id;
      mostrarDetalhe(date);
    }else if(action === 'cancelar-excluir'){
      obsConfirmandoExclusaoId = null;
      mostrarDetalhe(date);
    }else if(action === 'confirmar-excluir'){
      const listaAtual = lerObservacoes(key).filter(o => o.id !== id);
      salvarObservacoes(key, listaAtual);
      obsConfirmandoExclusaoId = null;
      renderCalendar();
      renderAvisoFooter();
      mostrarDetalhe(date);
    }else if(action === 'anexar'){
      const inputEl = document.getElementById('obsArquivo_' + id);
      if(inputEl) inputEl.click();
    }else if(action === 'salvar-item'){
      const textarea = document.getElementById('obsTexto_' + id);
      const texto = textarea ? textarea.value : '';
      let listaAtual = lerObservacoes(key);
      const existente = listaAtual.find(o => o.id === id);
      let fotoFinal = existente ? (existente.foto || null) : null;
      const msgEl = document.getElementById('notaSalvoMsg');
      let avisoFoto = '';
      if(arquivoAnexado){
        try{ fotoFinal = await comprimirImagem(arquivoAnexado, 900, 0.6); }
        catch(err){ fotoFinal = existente ? (existente.foto || null) : null; avisoFoto = ' Não deu pra processar a foto — salvei sem ela.'; }
      }
      const montarLista = (foto) => id === 'novo'
        ? [...listaAtual, {id: 'o' + Date.now(), texto, foto}]
        : listaAtual.map(o => o.id === id ? {...o, texto, foto} : o);
      let ok = salvarObservacoes(key, montarLista(fotoFinal));
      if(!ok && fotoFinal){
        // não coube com a foto — tenta salvar só o texto, sem perder o que foi escrito
        ok = salvarObservacoes(key, montarLista(null));
        avisoFoto = ' Sem espaço no navegador pra guardar a foto — salvei só o texto.';
      }
      if(ok){
        obsEditandoId = null;
        arquivoAnexado = null;
        renderCalendar();
        renderAvisoFooter();
        mostrarDetalhe(date);
      }else if(msgEl){
        msgEl.textContent = 'Não deu pra salvar — sem espaço no navegador.';
      }
      if(ok && avisoFoto){
        setTimeout(()=>{ const m = document.getElementById('notaSalvoMsg'); if(m) m.textContent = ('Observação salva.' + avisoFoto); }, 0);
      }
    }else if(action === 'compartilhar'){
      const listaAtual = lerObservacoes(key);
      const item = listaAtual.find(o => o.id === id);
      if(!item) return;
      const dataCurta = date.toLocaleDateString('pt-BR',{day:'2-digit', month:'long', year:'numeric'});
      const mensagem = `${dataCurta}${item.texto ? ' — ' + item.texto : ''}`;
      await compartilharObs(mensagem, item.foto);
    }
  });
}

let viewYear, viewMonth, diaSelecionado = null;
function renderCalendar(){
  const turma = turmaAtual();
  const title = document.getElementById('calTitle');
  const grid = document.getElementById('calGrid');
  title.textContent = (diaSelecionado && diaSelecionado.getMonth() === viewMonth && diaSelecionado.getFullYear() === viewYear)
    ? diaSelecionado.toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'})
    : new Date(viewYear, viewMonth, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  grid.innerHTML = '';

  ['D','S','T','Q','Q','S','S'].forEach(d=>{
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const today = new Date();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }

  for(let day=1; day<=daysInMonth; day++){
    const date = new Date(viewYear, viewMonth, day);
    const info = cycleInfo(date, turma);
    const el = document.createElement('div');
    el.className = 'cal-day ' + info.status;
    if(info.feriado) el.classList.add('feriado');
    if(lerObservacoes(dateKey(date)).length > 0) el.classList.add('com-nota');
    if(date.toDateString() === today.toDateString()) el.classList.add('hoje');
    if(diaSelecionado && date.toDateString() === diaSelecionado.toDateString()) el.classList.add('selecionado');
    el.textContent = day;
    const climaDia = CLIMA_CACHE[dateKey(date)];
    if(climaDia){
      const ico = document.createElement('span');
      ico.className = 'clima-ico';
      ico.textContent = climaIcone(climaDia.codigo);
      el.appendChild(ico);
    }
    el.addEventListener('click', ()=>{
      diaSelecionado = date;
      mostrarDetalhe(date);
      renderCalendar();
      renderAvisoFooter();
    });
    grid.appendChild(el);
  }
}

function limparFotosAntigas(diasLimite){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(!key || !key.startsWith(OBS_STORAGE_PREFIX)) continue;
      const partes = key.slice(OBS_STORAGE_PREFIX.length).split('-');
      if(partes.length !== 3) continue;
      const data = new Date(parseInt(partes[0],10), parseInt(partes[1],10)-1, parseInt(partes[2],10));
      const diffDias = Math.round((hoje - data) / 86400000);
      if(diffDias <= diasLimite) continue;
      let lista = [];
      try{ lista = JSON.parse(localStorage.getItem(key)) || []; }catch(e){ continue; }
      let mudou = false;
      lista.forEach(o => { if(o.foto){ o.foto = null; mudou = true; } });
      if(mudou) localStorage.setItem(key, JSON.stringify(lista));
    }
  }catch(e){}
}
